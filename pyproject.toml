[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-quant-bot"
version = "1.0.0"
description = "Research, backtesting, paper-trading, and guarded live-execution framework for Polymarket."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Srujal Sakhala"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
live = ["polymarket-client>=0.11,<0.12"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
polymarket-bot = "polymarket_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402", "E731"]
